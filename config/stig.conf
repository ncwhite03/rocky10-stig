# Pinned configuration for the Rocky Linux 10 STIG automation.
# Sourced by scripts/*.sh -- keep it plain POSIX shell variable assignments.

# --- SCAP content ------------------------------------------------------------
# Rocky's own scap-security-guide package ships ssg-rl10-ds.xml. Do NOT use the
# upstream ssg-rhel10-ds.xml on Rocky: every rule evaluates "notapplicable" (tested).
# The profile currently tracks DISA STIG V1R2; scripts/supplemental.sh adds the
# V1R3 (2026-09-30) differences until Rocky's package catches up.
SSG_DATASTREAM="/usr/share/xml/scap/ssg/content/ssg-rl10-ds.xml"

# "stig" = server without GUI, "stig_gui" = server with GUI
STIG_PROFILE="stig"

# --- Paths -------------------------------------------------------------------
INSTALL_DIR="/opt/rocky10-stig"
STATE_DIR="/var/lib/rocky10-stig"
LOG_DIR="/var/log/rocky10-stig"
BACKUP_DIR="/var/backups/rocky10-stig"
